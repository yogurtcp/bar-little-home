<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e9d1"><meta name="description" content="A cozy pixel-art home for Bar. Explore choices, everyday routines, and asking Mom or Dad for help, in Hebrew and English."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="בר בבית"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><title>בר בבית · Bar’s Little Home</title></head>
<body><main class="app"><header><div class="brand"><img src="./art/bar-face.webp" alt=""><div><h1>בַּר בַּבַּיִת</h1><span lang="en" dir="ltr">Bar’s Little Home</span></div></div><div class="family" aria-label="לבקש עזרה מההורים"><button data-parent="mom"><img src="./art/mom-face.webp" alt=""><span>אִמָּא<small lang="en">Mom</small></span></button><button data-parent="dad"><img src="./art/dad-face.webp" alt=""><span>אַבָּא<small lang="en">Dad</small></span></button></div><div id="life-controls"><span class="game-clock"><img id="day-icon" src="./art/sun.webp" alt=""><time id="game-time" dir="ltr">09:00</time></span><button id="pause" aria-label="הַפְסָקַת זְמַן / Pause time" aria-pressed="false">Ⅱ</button><button id="speed" aria-label="מְהִירוּת / Speed">1×</button><button id="wait" aria-label="זְמַן עוֹבֵר / Let time pass"><img src="./art/timer.webp" alt=""></button><button id="journal" aria-label="הַסִּפּוּר שֶׁלִּי / My story"><img src="./art/paper.webp" alt=""></button></div><nav><button id="replay" aria-label="לשמוע שוב בעברית ואז באנגלית">↻</button><button id="sound" aria-label="השתקת קול" title="קול / Sound">♪</button><button id="install">התקנה<small lang="en">Install</small></button><button id="about" aria-label="איך משחקים / How to play">?</button></nav></header>
<section id="stage" aria-label="הבית של בר"><div id="world"><div id="life-hud"><div id="needs" aria-label="מָה הַגּוּף צָרִיךְ? / Body needs"></div></div><div id="scene"><img class="backdrop" src="./art/house.webp" alt="בית פיקסל ארט: מטבח, סלון וחדר רחצה"><div id="daylight" aria-hidden="true"></div><div id="props"></div><div id="actors"><div id="adult" class="actor"><img alt=""></div><div id="bar" class="actor"><img src="./art/bar-idle.webp" alt="בר"><div class="odor" aria-hidden="true"><i></i><i></i><i></i></div><span class="feeling"></span><span class="dirt-marks" aria-hidden="true"><i></i><i></i><i></i></span><span class="wet-mark" aria-hidden="true"></span></div></div><div id="hotspots"></div><div id="effects" aria-hidden="true"></div></div><nav id="room-nav" aria-label="חַדְרֵי הַבַּיִת / Rooms"></nav><div id="choice-cloud" hidden><div id="actions" aria-label="מָה נַעֲשֶׂה עַכְשָׁו?"></div><div id="choice-pager" hidden><button data-page="-1" aria-label="אפשרויות קודמות / Previous choices">→</button><span aria-hidden="true"></span><button data-page="1" aria-label="עוד אפשרויות / More choices">←</button></div></div>
<section class="story" aria-label="הסיפור"><img id="story-face" src="./art/bar-face.webp" alt=""><span id="cause-chain" aria-hidden="true"></span><div id="story-text" aria-live="polite"></div></section>
<button id="back" aria-label="בחזרה לחקור את הבית">⌂</button></div></section><footer><span id="offline">מכינים את הבית גם בלי אינטרנט…</span></footer></main>
<dialog id="requests"><div class="dialog-title"><img id="request-parent" alt=""><h2 id="request-title"></h2><button data-close aria-label="סגירה / Close">×</button></div><div id="request-buttons"></div></dialog>
<dialog id="info"><button class="close" data-close aria-label="סגירה / Close">×</button><div id="info-content"></div></dialog><div id="announcement" class="sr-only" role="status"></div><script type="module" src="./app.js"></script></body></html>
