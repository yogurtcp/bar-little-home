<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e9d1"><meta name="description" content="A cozy pixel-art home for Bar. Explore choices, everyday routines, and asking Mom or Dad for help, in Hebrew and English."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="בר בבית"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><title>בר בבית · Bar’s Little Home</title></head>
<body><main class="app"><header><div class="brand"><img src="./art/bar-face.webp" alt=""><div><h1>בר בבית</h1><span lang="en" dir="ltr">Bar’s Little Home</span></div></div><div class="family" aria-label="לבקש עזרה מההורים"><button data-parent="mom"><img src="./art/mom-face.webp" alt=""><span>אמא<small lang="en">Mom</small></span></button><button data-parent="dad"><img src="./art/dad-face.webp" alt=""><span>אבא<small lang="en">Dad</small></span></button></div><nav><button id="replay" aria-label="לשמוע שוב בעברית ואז באנגלית">↻</button><button id="sound" aria-label="השתקת קול" title="קול / Sound">♪</button><button id="install">התקנה<small lang="en">Install</small></button><button id="about" aria-label="איך משחקים / How to play">?</button></nav></header>
<section id="stage" aria-label="הבית של בר"><div id="world"><img class="backdrop" src="./art/house.webp" alt="בית פיקסל ארט: מטבח, סלון וחדר רחצה"><div id="props"></div><div id="actors"><div id="adult" class="actor"><img alt=""></div><div id="bar" class="actor"><img src="./art/bar-idle.webp" alt="בר"><div class="odor" aria-hidden="true"><i></i><i></i><i></i></div><span class="feeling"></span></div></div><div id="hotspots"></div><div id="effects" aria-hidden="true"></div><div id="choice-cloud" hidden><div id="actions" aria-label="מה נעשה עכשיו?"></div></div>
<section class="story" aria-label="הסיפור"><img id="story-face" src="./art/bar-face.webp" alt=""><div id="story-text" aria-live="polite"></div></section>
<button id="back" aria-label="בחזרה לחקור את הבית">⌂</button></div></section><footer><span id="offline">מכינים את הבית גם בלי אינטרנט…</span></footer></main>
<dialog id="requests"><div class="dialog-title"><img id="request-parent" alt=""><h2 id="request-title"></h2><button data-close aria-label="סגירה / Close">×</button></div><div id="request-buttons"></div></dialog>
<dialog id="info"><button class="close" data-close aria-label="סגירה / Close">×</button><div id="info-content"></div></dialog><div id="announcement" class="sr-only" role="status"></div><script type="module" src="./app.js"></script></body></html>
